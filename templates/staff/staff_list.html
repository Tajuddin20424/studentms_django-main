{% extends 'base.html' %} 
{% load static %} 

{% block title %} Staff Management {% endblock %} 

{% block content %}
<div class="container py-5">
  <button
    class="btn btn-primary mb-3"
    id="addNewStaffBtn"
    data-bs-toggle="modal"
    data-bs-target="#addStaffModal"
  >
    + Add Staff
  </button>

  <h2 class="text-center mb-4">Staff List</h2>

  <table class="table table-bordered text-center">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>DOB</th>
        <th>Mobile</th>
        <th>Email</th>
        <th>Designation</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="staffTableBody"></tbody>
  </table>
</div>

<!-- ADD/EDIT STAFF MODAL -->
<div class="modal fade" id="addStaffModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <!-- The title will be changed dynamically using JavaScript (Add or Edit) -->
      <h4 class="text-center mb-3" id="modalTitle">Add Staff Member</h4>

      <form id="addStaffForm">
        {% csrf_token %}
        
        <!-- This hidden input is required to retain the ID during editing. -->
        <input type="hidden" id="staff_id" name="id">

        <input
          type="text"
          name="name"
          class="form-control mb-2"
          placeholder="Full Name"
          required
        />
        <input
          type="date"
          name="dob"
          class="form-control mb-2"
          placeholder="Date of Birth"
        />
        <input
          type="text"
          name="mobile"
          class="form-control mb-2"
          placeholder="Mobile Number"
        />
        <input
          type="email"
          name="email"
          class="form-control mb-2"
          placeholder="Email Address"
        />

        <div class="mb-3">
          <label for="designation_combo" class="form-label">Select Designation:</label>
          <div class="d-flex">
            <select
              name="designation" 
              id="designation_combo"
              class="form-select me-2"
              required
            >
              <option value="">Choose...</option>
              <!--  (staff_designation_combo.js)  -->
            </select>

            <button type="button" class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#addDesignationModal">
              +
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2" id="saveBtn">
          Save Staff
        </button>
      </form>
    </div>
  </div>
</div>

<!-- QUICK ADD DESIGNATION MODAL -->
<div class="modal fade" id="addDesignationModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content p-3 shadow-lg">
      <h5 class="text-center mb-3">New Designation</h5>
      <form id="quickAddDesignationForm">
        {% csrf_token %}
        <input
          type="text"
          id="new_designation_name"
          name="name" 
          class="form-control mb-3"
          placeholder="Designation Name"
          required
        />
        <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-success btn-sm">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %} 

{% block extra_js %}
<script src="{% static 'js/staff.js' %}"></script>
<script src="{% static 'js/staff_designation_combo.js' %}"></script>

<script>
    // যখন 'Add Staff' বাটনে ক্লিক করা হবে, তখন ফর্মটি রিসেট করতে হবে
    document.getElementById('addNewStaffBtn').addEventListener('click', function() {
        document.getElementById('addStaffForm').reset();
        document.getElementById('staff_id').value = '';
        document.getElementById('modalTitle').innerText = 'Add Staff Member';
        document.getElementById('saveBtn').innerText = 'Save Staff';
    });
</script>
{% endblock %}
